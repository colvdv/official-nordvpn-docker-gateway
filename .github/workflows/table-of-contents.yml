name: Generate Table of Contents
on:
  push:
    paths:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-toc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Generate Table of Contents
        uses: technote-space/toc-generator@9e238e7974de5fcf7b17b7acc54c896160dda0a3
        with:
          TOC_TITLE: "#### 📑 Table of Contents:"
          # Using your existing markers to ensure perfect integration
          OPENING_COMMENT: "<!-- OPEN table-of-contents.yml -->"
          CLOSING_COMMENT: "<!-- CLOSE table-of-contents.yml -->"
          # Corrected parameter name for this version
          MAX_HEADER_LEVEL: 4
          FOLDING: false

      - name: Commit changes to README.md
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9
        with:
          commit_message: "docs: update Table of Contents"
          file_pattern: README.md
